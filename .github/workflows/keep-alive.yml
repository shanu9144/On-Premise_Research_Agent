name: Keep Render API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL || 'https://on-premise-research-agent.onrender.com' }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$API_URL/health"
